# grafana01 - lab Grafana VM (Rocky 9 minimal). Loaded automatically by Anaconda from the OEMDRV-labelled CD.
text
cdrom
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone Europe/Copenhagen --utc
network --bootproto=static --device=link --ip=192.168.2.13 --netmask=255.255.255.0 --gateway=192.168.2.1 --nameserver=192.168.2.5 --hostname=grafana01.lab.kabun.io --onboot=on --activate
rootpw --lock
user --name=labadmin --groups=wheel --lock
sshkey --username=labadmin "ssh-rsa  karsten.bundgaard@vsap-mac-F1Y602M4JY"
sshkey --username=labadmin "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKJXEvIeqOTxCqSe1NYRmysW2RjXVnbNLjWwv5MKyqtG kabun@vone"
firewall --enabled --service=ssh --remove-service=cockpit --remove-service=dhcpv6-client
selinux --enforcing
services --enabled=sshd,chronyd
zerombr
clearpart --all --initlabel
autopart --type=lvm
bootloader
skipx
firstboot --disabled
poweroff

%packages
@^minimal-environment
openssh-server
chrony
tar
curl
-iwl*firmware
%end

%post --log=/root/ks-post.log
set -x
echo 'labadmin ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/labadmin && chmod 440 /etc/sudoers.d/labadmin
printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin no\nX11Forwarding no\nAllowUsers labadmin\n' > /etc/ssh/sshd_config.d/10-lab.conf
dnf -y install open-vm-tools && systemctl enable vmtoolsd || echo 'open-vm-tools not installed (no internet during install) - install it later'
echo "grafana01 provisioned: $(date)" > /root/PROVISIONED.txt
%end
